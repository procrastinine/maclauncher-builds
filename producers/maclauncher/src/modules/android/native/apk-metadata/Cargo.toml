[package]
name = "android-apk-metadata"
version = "1.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "android-apk-metadata"
path = "main.rs"

[workspace]
resolver = "2"
members = ["upstream/crates/aim-apps", "upstream/crates/aim-android-xml", "upstream/tools/android-image-extract"]

[workspace.package]
license = "Apache-2.0"

[workspace.dependencies]
libc = "=0.2.189"
sha2 = "=0.10.9"

[dependencies]
aim-apps = { path = "upstream/crates/aim-apps" }
serde_json = "=1.0.151"

[profile.release]
opt-level = 2
strip = "debuginfo"
