name: Build runtime package
description: Build, package and attest one declared runtime package.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-node
    - name: Register the selected names for this build
      shell: bash
      run: |
        node --input-type=module <<'JS'
        import {registerSelection} from './tools/release-selection.mjs';
        registerSelection({selection: process.env.RELEASE_SELECTION, directory: process.cwd()});
        JS
    - name: Read the generated package definitions
      uses: ./.github/actions/download-artifact
      with:
        inputs: '{"name":"release-plan","path":"${{ runner.temp }}/release-plan"}'
    - name: Use the package definition file
      shell: bash
      run: echo "BUILD_REPORTS=$RUNNER_TEMP/release-plan/reports.json" >> "$GITHUB_ENV"
    - name: Prepare the resolved package inputs
      shell: bash
      run: node tools/build-run-inputs.mjs prepare --project "$BUILD_PROJECT" --output "$RUNNER_TEMP/prepared-inputs"
    - name: Prepare the runner
      shell: bash
      run: node tools/build-runtime.mjs --prepare --project "$BUILD_PROJECT" --arch "$BUILD_ARCH" --version "$BUILD_VERSION"
    - name: Build the package
      shell: bash
      run: node tools/build-runtime.mjs --project "$BUILD_PROJECT" --arch "$BUILD_ARCH" --version "$BUILD_VERSION" --output "$RUNNER_TEMP/build" --work "$RUNNER_TEMP/work"
    - name: Package the release
      shell: bash
      run: node tools/release-package.mjs prepare --project "$BUILD_PROJECT" --input "$RUNNER_TEMP/build/payload" --declaration "$RUNNER_TEMP/build/declaration.json" --source-revision "$GITHUB_SHA" --output "$RUNNER_TEMP/release"
    - name: Report output symptoms
      continue-on-error: true
      shell: bash
      run: node tools/output-warnings.mjs "$RUNNER_TEMP/build/payload" "$BUILD_ARCH" "$RUNNER_TEMP/build/declaration.json" "$RUNNER_TEMP/release"
    # Signed provenance ties the archive to this workflow run and commit.
    - uses: ./.github/actions/attest
      id: attest
      env:
        NODE_OPTIONS: --max-http-header-size=32768
      with:
        inputs: '{"subject-path":"${{ runner.temp }}/release/*.tar.gz","github-token":"${{ github.token }}"}'
    - uses: ./.github/actions/upload-artifact
      if: ${{ !cancelled() && steps.attest.outcome == 'success' }}
      with:
        inputs: '{"name":"runtime-${{ env.BUILD_PROJECT }}-${{ env.BUILD_VERSION }}-${{ env.BUILD_ARCH }}","path":"${{ runner.temp }}/release","if-no-files-found":"error","overwrite":"true","retention-days":"90","compression-level":"0"}'
