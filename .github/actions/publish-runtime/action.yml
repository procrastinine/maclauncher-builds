name: Publish verified runtime packages
description: Publish one completed level from retained attested artifacts.
inputs:
  level:
    description: Publication result artifact label
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-node
    - shell: bash
      run: npm ci --ignore-scripts
    - name: Prepare the sources publication reads
      shell: bash
      run: node tools/init-runtime-sources.mjs
    - name: Read the generated package definitions
      uses: ./.github/actions/download-artifact
      with:
        inputs: '{"name":"release-plan","path":"${{ runner.temp }}/release-plan"}'
    - name: Use the package definition file
      shell: bash
      run: echo "BUILD_REPORTS=$RUNNER_TEMP/release-plan/reports.json" >> "$GITHUB_ENV"
    - name: Publish successful packages from this build level
      shell: bash
      run: node tools/publish-level.mjs --output "$RUNNER_TEMP/publication"
    - name: Retain the publication result
      uses: ./.github/actions/upload-artifact
      if: always()
      with:
        inputs: '{"name":"publication-${{ inputs.level }}-${{ github.run_attempt }}","path":"${{ runner.temp }}/publication/publication-result.json","if-no-files-found":"ignore","overwrite":"true"}'
