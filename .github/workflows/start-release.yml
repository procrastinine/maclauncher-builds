name: Start release
on:
  push:
    branches: [main]
    paths: [releases.txt]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Bootstrap requires a literal before local actions exist.
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - run: npm ci --ignore-scripts
      - id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: node tools/changed-releases.mjs "$BEFORE" "$RUNNER_TEMP/releases-changed.txt"
      - name: Initialize source pin metadata
        if: steps.changes.outputs.changed == 'true'
        run: |
          node --input-type=module -e "import {retryNetwork} from './tools/download.mjs'; import {execFileSync} from 'node:child_process'; retryNetwork(()=>execFileSync('git',['submodule','update','--init','--depth','1','--','sources/maclauncher'],{stdio:['inherit','inherit','pipe']}));"
          node tools/init-runtime-sources.mjs --metadata
      - if: steps.changes.outputs.changed == 'true'
        run: node tools/dispatch-release.mjs dispatch --file "$RUNNER_TEMP/releases-changed.txt"
