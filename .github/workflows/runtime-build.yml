name: Build and release
run-name: Build and release — ${{ inputs.releases }}

on:
  workflow_dispatch:
    inputs:
      releases:
        description: 'Project=release-name pairs, separated by commas or newlines'
        required: true
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      selection: ${{ steps.plan.outputs.selection }}
      empty: ${{ steps.plan.outputs.empty }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASES: ${{ inputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Select the requested projects and names
        id: plan
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {registerSelection} from './tools/release-selection.mjs';
          import {buildPlan} from './tools/build-runtime.mjs';
          const releases = JSON.parse(execFileSync('gh', ['api', '--paginate', '--slurp', `repos/${process.env.GITHUB_REPOSITORY}/releases?per_page=100`], {encoding: 'utf8'})).flat().filter(release => !release.draft);
          const result = registerSelection({selection: process.env.RELEASES, directory: process.cwd(), releases});
          const include = result.selection.flatMap(({id, version}) => buildPlan({project: id, version, arch: 'all', tags: () => []}).include);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({include})}\nselection=${JSON.stringify(result.selection)}\nempty=${include.length === 0}\n`);
          JS

  build:
    needs: plan
    if: needs.plan.outputs.empty == 'false'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: build (${{ matrix.project }} ${{ matrix.version }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_PROJECT: ${{ matrix.project }}
      BUILD_VERSION: ${{ matrix.version }}
      BUILD_ARCH: ${{ matrix.arch }}
      RELEASE_SELECTION: ${{ needs.plan.outputs.selection }}
    steps:
      - name: Report initial disk space
        run: df -h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked build-tool dependencies
        run: npm ci --ignore-scripts
      - name: Register the selected names for this build
        run: |
          node --input-type=module <<'JS'
          import {registerSelection} from './tools/release-selection.mjs';
          registerSelection({selection: process.env.RELEASE_SELECTION, directory: process.cwd()});
          JS
      - name: Prepare the runner
        run: node tools/build-runtime.mjs --prepare --project "$BUILD_PROJECT" --arch "$BUILD_ARCH" --version "$BUILD_VERSION"
      - name: Build the package
        run: node tools/build-runtime.mjs --project "$BUILD_PROJECT" --arch "$BUILD_ARCH" --version "$BUILD_VERSION" --output "$RUNNER_TEMP/build" --work "$RUNNER_TEMP/work"
      - name: Package the release
        run: node tools/release-runtime.mjs prepare --project "$BUILD_PROJECT" --input "$RUNNER_TEMP/build/payload" --declaration "$RUNNER_TEMP/build/declaration.json" --source-revision "$GITHUB_SHA" --output "$RUNNER_TEMP/release"
      - name: Verify the package identity
        id: verify
        run: node tools/release-runtime.mjs verify --bundle "$RUNNER_TEMP/release" --project "$BUILD_PROJECT" --version "$BUILD_VERSION" --arch "$BUILD_ARCH"
      # Signed provenance that ties the compiled package archive to this workflow run and commit.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        if: ${{ !matrix.supplied }}
        continue-on-error: true
        with:
          subject-path: ${{ runner.temp }}/release/*.tar.gz
      - name: Wait before retrying the attestation request
        if: steps.attest.outcome == 'failure' && !cancelled()
        run: sleep 5
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.attest.outcome == 'failure' && !cancelled()
        with:
          subject-path: ${{ runner.temp }}/release/*.tar.gz
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        with:
          name: runtime-${{ matrix.project }}-${{ matrix.version }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  publish:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.empty == 'false' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: build-and-release-publication
      queue: max
    permissions:
      contents: write
      actions: read
      attestations: read
    outputs:
      commit: ${{ steps.catalog.outputs.commit }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SELECTION: ${{ needs.plan.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Register the selected release names
        run: |
          node --input-type=module <<'JS'
          import {registerSelection} from './tools/release-selection.mjs';
          registerSelection({selection: process.env.RELEASE_SELECTION, directory: process.cwd()});
          JS
      - name: Publish this run's verified packages
        id: publish
        continue-on-error: true
        run: node tools/publish-verified.mjs --output "$RUNNER_TEMP/publication"
      - name: Commit registrations and catalogs
        id: catalog
        run: |
          git add --update
          git add -- catalogs attestations
          if ! git diff --cached --quiet; then
            git config user.name procrastinine
            git config user.email 24549552+procrastinine@users.noreply.github.com
            git commit -m 'Publish selected runtime releases'
            gh auth setup-git
            git push origin HEAD:main
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Retain the publication result
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: publication-result
          path: ${{ runner.temp }}/publication/publication-result.json
          if-no-files-found: ignore
      - name: Report incomplete packages
        if: steps.publish.outcome == 'failure'
        run: exit 1

  index:
    needs: publish
    if: ${{ always() && !cancelled() && needs.publish.outputs.commit != '' }}
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      source-revision: ${{ needs.publish.outputs.commit }}
