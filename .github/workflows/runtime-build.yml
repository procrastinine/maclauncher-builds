name: Build and release
run-name: ${{ inputs.publish && 'Build and release' || 'Build without publishing' }} — ${{ inputs.releases }}

on:
  workflow_dispatch:
    inputs:
      releases:
        description: 'Project=release-name pairs, separated by commas or newlines'
        required: true
        type: string
      publish:
        description: 'Publish packages whose architectures all built'
        required: false
        default: true
        type: boolean


env:
  MACLAUNCHER_PACKAGE_PRODUCER: '1'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      selection: ${{ steps.plan.outputs.selection }}
      graph: ${{ steps.plan.outputs.graph }}
      reuse: ${{ steps.plan.outputs.reuse }}
      levels: ${{ steps.plan.outputs.levels }}
      targets: ${{ steps.plan.outputs.targets }}
      empty: ${{ steps.plan.outputs.empty }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASES: ${{ inputs.releases }}
      RELEASE_PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Bootstrap requires a literal before local actions exist.
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm ci --ignore-scripts
      - name: Prepare the sources the plan reads
        run: node tools/init-runtime-sources.mjs --metadata
      - name: Select the requested projects and names
        id: plan
        run: node tools/plan-build-release.mjs --output "$RUNNER_TEMP/release-plan"
      - name: Retain the generated package definitions
        uses: ./.github/actions/upload-artifact
        with:
          inputs: '{"name":"release-plan","path":"${{ runner.temp }}/release-plan/reports.json","if-no-files-found":"error","overwrite":"true","retention-days":"30"}'

  # Levels run in order and their count is plan data. A level's builds read
  # earlier levels' artifacts from this run.
  level:
    needs: [plan]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.empty == 'false' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        level: ${{ fromJSON(needs.plan.outputs.levels) }}
    name: level ${{ matrix.level.index }}
    uses: ./.github/workflows/runtime-level.yml
    permissions:
      contents: read
      actions: read
    with:
      targets: ${{ toJSON(matrix.level.include) }}
      selection: ${{ needs.plan.outputs.selection }}
      graph: ${{ needs.plan.outputs.graph }}
      reuse: ${{ needs.plan.outputs.reuse }}

  # Signed provenance ties every built file to this workflow, run and commit.
  attest:
    needs: [plan, level]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.empty == 'false' && inputs.publish }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Bootstrap requires a literal before local actions exist.
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Read the built packages
        uses: ./.github/actions/download-artifact
        with:
          inputs: '{"pattern":"runtime-*","path":"${{ runner.temp }}/runtime"}'
      - name: Count the built files
        id: built
        run: echo "files=$(find "$RUNNER_TEMP/runtime" -type f 2>/dev/null | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/attest
        if: ${{ steps.built.outputs.files != '0' }}
        env:
          NODE_OPTIONS: --max-http-header-size=32768
        with:
          inputs: '{"subject-path":"${{ runner.temp }}/runtime/**","github-token":"${{ github.token }}"}'

  # A package version publishes only when every one of its architectures built.
  # Packages publish in level order, so inputs are public before their consumers.
  publish:
    needs: [plan, attest]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.attest.result == 'success' }}
    concurrency:
      group: build-and-release-publication
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SELECTION: ${{ needs.plan.outputs.selection }}
      PUBLICATION_TARGETS: ${{ needs.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Bootstrap requires a literal before local actions exist.
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/publish-runtime
        with:
          level: all

  index:
    needs: [plan, publish]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && inputs.publish }}
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      source-revision: main

  timings:
    needs: [plan, level, attest, publish, index]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Bootstrap requires a literal before local actions exist.
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: node tools/init-runtime-sources.mjs
      - name: Summarize package job durations
        run: node tools/job-timings.mjs --repo "${{ github.repository }}" --run "${{ github.run_id }}"
