name: Runtime build

on:
  # A push builds only the build records whose version or architectures it changes.
  push:
    branches: [main]
    paths:
      - projects.json
      - projects/**
  workflow_dispatch:
    inputs:
      project:
        description: Registered runtime project ID
        required: true
        type: string
      version:
        description: Version in the project's build record (optional check)
        required: false
        type: string
      arch:
        description: Package architectures to build
        required: true
        default: all
        type: choice
        options: [all, arm64, x64, universal]
      operation:
        description: Build packages, or build them and stage draft releases
        required: true
        default: build
        type: choice
        options: [build, stage]

permissions:
  contents: read

concurrency:
  group: runtime-build-${{ inputs.project || github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      empty: ${{ steps.plan.outputs.empty }}
    env:
      EVENT: ${{ github.event_name }}
      BEFORE: ${{ github.event.before }}
      BUILD_PROJECT: ${{ inputs.project }}
      BUILD_VERSION: ${{ inputs.version }}
      BUILD_ARCH: ${{ inputs.arch }}
    steps:
      # Full history and tags: the plan compares the registry with the previous commit
      # and skips architectures that already have a release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked build-tool dependencies
        run: npm ci --ignore-scripts
      - name: Select new builds and their runners
        id: plan
        run: |
          if [ "$EVENT" = push ]; then
            matrix=$(node tools/build-runtime.mjs --plan --before "$BEFORE")
          elif [ -n "$BUILD_VERSION" ]; then
            matrix=$(node tools/build-runtime.mjs --plan --project "$BUILD_PROJECT" --arch "$BUILD_ARCH" --version "$BUILD_VERSION")
          else
            matrix=$(node tools/build-runtime.mjs --plan --project "$BUILD_PROJECT" --arch "$BUILD_ARCH")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$matrix" = '{"include":[]}' ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "No build record declares a new version or architecture." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.empty == 'false'
    # Each recipe selects a standard GitHub-hosted build image. A registered publisher input
    # instead assembles its supplied package from the pinned publisher archive.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: build (${{ matrix.project }} ${{ matrix.version }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_PROJECT: ${{ matrix.project }}
      BUILD_VERSION: ${{ matrix.version }}
      BUILD_ARCH: ${{ matrix.arch }}
    steps:
      - name: Report initial disk space
        run: df -h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked build-tool dependencies
        run: npm ci --ignore-scripts
      - name: Prepare the runner
        if: ${{ !matrix.supplied }}
        run: node tools/build-runtime.mjs --prepare --project "$BUILD_PROJECT" --arch "$BUILD_ARCH" --version "$BUILD_VERSION"
      - name: Build the package
        if: ${{ !matrix.supplied }}
        run: node tools/build-runtime.mjs --project "$BUILD_PROJECT" --arch "$BUILD_ARCH" --version "$BUILD_VERSION" --output "$RUNNER_TEMP/build" --work "$RUNNER_TEMP/work"
      - name: Package the release
        if: ${{ !matrix.supplied }}
        run: node tools/release-runtime.mjs prepare --project "$BUILD_PROJECT" --input "$RUNNER_TEMP/build/payload" --declaration "$RUNNER_TEMP/build/declaration.json" --source-revision "$GITHUB_SHA" --output "$RUNNER_TEMP/release"
      - name: Download the pinned publisher input
        if: ${{ matrix.supplied }}
        run: node tools/publisher-files.mjs fetch --project "$BUILD_PROJECT" --output "$RUNNER_TEMP/publisher-input.tar.gz"
      - name: Assemble the supplied package
        if: ${{ matrix.supplied }}
        run: node tools/publisher-files.mjs assemble --project "$BUILD_PROJECT" --input-archive "$RUNNER_TEMP/publisher-input.tar.gz" --output "$RUNNER_TEMP/release" --work "$RUNNER_TEMP/work"
      # The comparison covers every supplied file; the release workflow repeats it before publication.
      - name: Record supplied-file equality
        if: ${{ matrix.supplied }}
        run: node tools/publisher-files.mjs record --project "$BUILD_PROJECT" --input-archive "$RUNNER_TEMP/publisher-input.tar.gz" --release-bundle "$RUNNER_TEMP/release" --output-dir "$RUNNER_TEMP/publisher-records"
      - name: Verify the package identity
        id: verify
        run: node tools/release-runtime.mjs verify --bundle "$RUNNER_TEMP/release" --project "$BUILD_PROJECT" --version "$BUILD_VERSION" --arch "$BUILD_ARCH"
      # Signed provenance that ties the compiled package archive to this workflow run and commit.
      # Supplied packages rely on their file-equality record instead.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        if: ${{ !matrix.supplied }}
        continue-on-error: true
        with:
          subject-path: ${{ runner.temp }}/release/*.tar.gz
      - name: Wait before retrying the attestation request
        if: steps.attest.outcome == 'failure' && !cancelled()
        run: sleep 5
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.attest.outcome == 'failure' && !cancelled()
        with:
          subject-path: ${{ runner.temp }}/release/*.tar.gz
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        with:
          name: runtime-${{ matrix.project }}-${{ matrix.version }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ !cancelled() && matrix.supplied && steps.verify.outcome == 'success' }}
        with:
          name: publisher-record-${{ matrix.project }}-${{ matrix.version }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/publisher-records
          if-no-files-found: error
          retention-days: 90

  stage:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'stage'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PROJECT: ${{ inputs.project }}
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Draft releases are staged only from main." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked build-tool dependencies
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-${{ inputs.project }}-*
          path: ${{ runner.temp }}/releases
      - name: Select the publication authority
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {readPublisherInput} from './tools/publisher-files.mjs';
          const supplied = readPublisherInput({project: process.env.PROJECT});
          fs.appendFileSync(process.env.GITHUB_ENV, 'PUBLICATION_AUTHORITY=' + (supplied ? 'supplied-publisher' : 'github-build') + '\n');
          JS
      - name: Download the pinned publisher input
        if: env.PUBLICATION_AUTHORITY == 'supplied-publisher'
        run: node tools/publisher-files.mjs fetch --project "$PROJECT" --output "$RUNNER_TEMP/publisher-input.tar.gz"
      - name: Stage one draft release for each architecture
        # The tag of each draft points to the commit these packages were built from.
        # Compiled packages import their signed provenance; supplied packages repeat their file comparison.
        run: |
          for bundle in "$RUNNER_TEMP"/releases/*/; do
            if [ "$PUBLICATION_AUTHORITY" = supplied-publisher ]; then
              node tools/publisher-files.mjs record --project "$PROJECT" --input-archive "$RUNNER_TEMP/publisher-input.tar.gz" --release-bundle "$bundle"
            else
              node tools/record-github-build.mjs --release-bundle "$bundle"
            fi
            node tools/release-runtime.mjs stage --bundle "$bundle" --target "$GITHUB_SHA"
            node tools/release-runtime.mjs verify-remote --bundle "$bundle"
          done
