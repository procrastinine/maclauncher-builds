name: Build and release
run-name: ${{ inputs.publish && 'Build and release' || 'Build without publishing' }} — ${{ inputs.releases }}

on:
  workflow_dispatch:
    inputs:
      releases:
        description: 'Project=release-name pairs, separated by commas or newlines'
        required: true
        type: string
      publish:
        description: 'Publish packages whose architectures all built'
        required: false
        default: true
        type: boolean


env:
  MACLAUNCHER_PACKAGE_PRODUCER: '1'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: read
    outputs:
      selection: ${{ steps.plan.outputs.selection }}
      graph: ${{ steps.plan.outputs.graph }}
      reuse: ${{ steps.plan.outputs.reuse }}
      levels: ${{ steps.plan.outputs.levels }}
      empty: ${{ steps.plan.outputs.empty }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASES: ${{ inputs.releases }}
      RELEASE_PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Bootstrap requires a literal before local actions exist.
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm ci --ignore-scripts
      - name: Prepare the sources the plan reads
        run: node tools/init-runtime-sources.mjs --metadata
      - name: Select the requested projects and names and check publication conditions
        id: plan
        run: node tools/plan-build-release.mjs --output "$RUNNER_TEMP/release-plan"
      - name: Retain the generated package definitions
        uses: ./.github/actions/upload-artifact
        with:
          inputs: '{"name":"release-plan","path":"${{ runner.temp }}/release-plan/reports.json","if-no-files-found":"error","overwrite":"true","retention-days":"30"}'

  # Each level builds every architecture of its packages, then publishes the
  # complete packages. Levels run in order; their count is plan data.
  level:
    needs: [plan]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.empty == 'false' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        level: ${{ fromJSON(needs.plan.outputs.levels) }}
    name: level ${{ matrix.level.index }}
    uses: ./.github/workflows/runtime-level.yml
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    with:
      targets: ${{ toJSON(matrix.level) }}
      selection: ${{ needs.plan.outputs.selection }}
      graph: ${{ needs.plan.outputs.graph }}
      reuse: ${{ needs.plan.outputs.reuse }}
      publish: ${{ inputs.publish }}

  index:
    needs: [plan, level]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && inputs.publish }}
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      source-revision: main

  timings:
    needs: [plan, level, index]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Bootstrap requires a literal before local actions exist.
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Summarize package job durations
        run: node tools/job-timings.mjs --repo "${{ github.repository }}" --run "${{ github.run_id }}"
