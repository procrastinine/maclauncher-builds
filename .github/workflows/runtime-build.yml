name: Runtime build

on:
  # A push builds only the build records whose version or architectures it changes.
  push:
    branches: [main]
    paths:
      - projects.json
      - projects/**
  workflow_dispatch:
    inputs:
      project:
        description: Registered runtime project ID
        required: true
        type: string
      version:
        description: Version in the project's build record (optional check)
        required: false
        type: string
      arch:
        description: Package architectures to build
        required: true
        default: all
        type: choice
        options: [all, arm64, x64, universal]
      operation:
        description: Build packages, or build them and stage draft releases
        required: true
        default: build
        type: choice
        options: [build, stage]

permissions:
  contents: read

concurrency:
  group: runtime-build-${{ inputs.project || github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      empty: ${{ steps.plan.outputs.empty }}
    env:
      EVENT: ${{ github.event_name }}
      BEFORE: ${{ github.event.before }}
      PROJECT: ${{ inputs.project }}
      VERSION: ${{ inputs.version }}
      ARCH: ${{ inputs.arch }}
    steps:
      # Full history and tags: the plan compares the registry with the previous commit
      # and skips architectures that already have a release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked build-tool dependencies
        run: npm ci --ignore-scripts
      - name: Select new builds and their runners
        id: plan
        run: |
          if [ "$EVENT" = push ]; then
            matrix=$(node tools/build-runtime.mjs --plan --before "$BEFORE")
          elif [ -n "$VERSION" ]; then
            matrix=$(node tools/build-runtime.mjs --plan --project "$PROJECT" --arch "$ARCH" --version "$VERSION")
          else
            matrix=$(node tools/build-runtime.mjs --plan --project "$PROJECT" --arch "$ARCH")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$matrix" = '{"include":[]}' ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "No build record declares a new version or architecture." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.empty == 'false'
    # Each recipe selects a standard GitHub-hosted build image.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: build (${{ matrix.project }} ${{ matrix.version }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      PROJECT: ${{ matrix.project }}
      VERSION: ${{ matrix.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Report initial disk space
        run: df -h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked build-tool dependencies
        run: npm ci --ignore-scripts
      - name: Prepare the runner
        run: node tools/build-runtime.mjs --prepare --project "$PROJECT" --arch "$ARCH" --version "$VERSION"
      - name: Build the package
        run: node tools/build-runtime.mjs --project "$PROJECT" --arch "$ARCH" --version "$VERSION" --output "$RUNNER_TEMP/build" --work "$RUNNER_TEMP/work"
      - name: Package the release
        run: node tools/release-runtime.mjs prepare --project "$PROJECT" --input "$RUNNER_TEMP/build/payload" --declaration "$RUNNER_TEMP/build/declaration.json" --source-revision "$GITHUB_SHA" --output "$RUNNER_TEMP/release"
      - name: Verify the package identity
        id: verify
        run: node tools/release-runtime.mjs verify --bundle "$RUNNER_TEMP/release" --project "$PROJECT" --version "$VERSION" --arch "$ARCH"
      # Signed provenance that ties the package archive to this workflow run and commit.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        continue-on-error: true
        with:
          subject-path: ${{ runner.temp }}/release/*.tar.gz
      - name: Wait before retrying the attestation request
        if: steps.attest.outcome == 'failure' && !cancelled()
        run: sleep 5
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.attest.outcome == 'failure' && !cancelled()
        with:
          subject-path: ${{ runner.temp }}/release/*.tar.gz
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        with:
          name: runtime-${{ matrix.project }}-${{ matrix.version }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  stage:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'stage'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Draft releases are staged only from main." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked build-tool dependencies
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-${{ inputs.project }}-*
          path: ${{ runner.temp }}/releases
      - name: Stage one draft release for each architecture
        # The tag of each draft points to the commit these packages were built from.
        run: |
          for bundle in "$RUNNER_TEMP"/releases/*/; do
            node tools/record-github-build.mjs --release-bundle "$bundle"
            node tools/release-runtime.mjs stage --bundle "$bundle" --target "$GITHUB_SHA"
            node tools/release-runtime.mjs verify-remote --bundle "$bundle"
          done
