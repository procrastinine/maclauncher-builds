name: Build and release
run-name: Build and release — ${{ inputs.releases }}

on:
  workflow_dispatch:
    inputs:
      releases:
        description: 'Project=release-name pairs, separated by commas or newlines'
        required: true
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      selection: ${{ steps.plan.outputs.selection }}
      empty: ${{ steps.plan.outputs.empty }}
      graph: ${{ steps.plan.outputs.graph }}
      reuse: ${{ steps.plan.outputs.reuse }}
      matrixIndependent: ${{ steps.plan.outputs.matrixIndependent }}
      emptyIndependent: ${{ steps.plan.outputs.emptyIndependent }}
      matrix0: ${{ steps.plan.outputs.matrix0 }}
      empty0: ${{ steps.plan.outputs.empty0 }}
      matrix1: ${{ steps.plan.outputs.matrix1 }}
      empty1: ${{ steps.plan.outputs.empty1 }}
      matrix2: ${{ steps.plan.outputs.matrix2 }}
      empty2: ${{ steps.plan.outputs.empty2 }}
      matrix3: ${{ steps.plan.outputs.matrix3 }}
      empty3: ${{ steps.plan.outputs.empty3 }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASES: ${{ inputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Select the requested projects and names
        id: plan
        run: node tools/plan-build-release.mjs --output "$RUNNER_TEMP/release-plan"
      - name: Retain the generated package definitions
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan/reports.json
          if-no-files-found: error
          retention-days: 7

  independent:
    needs: [plan]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.emptyIndependent == 'false' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrixIndependent) }}
    name: build (${{ matrix.project }} ${{ matrix.version }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_PROJECT: ${{ matrix.project }}
      BUILD_VERSION: ${{ matrix.version }}
      BUILD_ARCH: ${{ matrix.arch }}
      RELEASE_GRAPH: ${{ needs.plan.outputs.graph }}
      RELEASE_SELECTION: ${{ needs.plan.outputs.selection }}
      RELEASE_REUSE: ${{ needs.plan.outputs.reuse }}
    steps:
      - name: Report initial disk space
        run: df -h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - uses: ./.github/actions/build-runtime

  build0:
    needs: [plan]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.empty0 == 'false' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix0) }}
    name: build (${{ matrix.project }} ${{ matrix.version }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_PROJECT: ${{ matrix.project }}
      BUILD_VERSION: ${{ matrix.version }}
      BUILD_ARCH: ${{ matrix.arch }}
      RELEASE_GRAPH: ${{ needs.plan.outputs.graph }}
      RELEASE_SELECTION: ${{ needs.plan.outputs.selection }}
      RELEASE_REUSE: ${{ needs.plan.outputs.reuse }}
    steps:
      - name: Report initial disk space
        run: df -h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - uses: ./.github/actions/build-runtime

  build1:
    needs: [plan, build0]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.empty1 == 'false' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix1) }}
    name: build (${{ matrix.project }} ${{ matrix.version }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_PROJECT: ${{ matrix.project }}
      BUILD_VERSION: ${{ matrix.version }}
      BUILD_ARCH: ${{ matrix.arch }}
      RELEASE_GRAPH: ${{ needs.plan.outputs.graph }}
      RELEASE_SELECTION: ${{ needs.plan.outputs.selection }}
      RELEASE_REUSE: ${{ needs.plan.outputs.reuse }}
    steps:
      - name: Report initial disk space
        run: df -h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - uses: ./.github/actions/build-runtime

  build2:
    needs: [plan, build0, build1]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.empty2 == 'false' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix2) }}
    name: build (${{ matrix.project }} ${{ matrix.version }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_PROJECT: ${{ matrix.project }}
      BUILD_VERSION: ${{ matrix.version }}
      BUILD_ARCH: ${{ matrix.arch }}
      RELEASE_GRAPH: ${{ needs.plan.outputs.graph }}
      RELEASE_SELECTION: ${{ needs.plan.outputs.selection }}
      RELEASE_REUSE: ${{ needs.plan.outputs.reuse }}
    steps:
      - name: Report initial disk space
        run: df -h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - uses: ./.github/actions/build-runtime

  build3:
    needs: [plan, build0, build1, build2]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.empty3 == 'false' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix3) }}
    name: build (${{ matrix.project }} ${{ matrix.version }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_PROJECT: ${{ matrix.project }}
      BUILD_VERSION: ${{ matrix.version }}
      BUILD_ARCH: ${{ matrix.arch }}
      RELEASE_GRAPH: ${{ needs.plan.outputs.graph }}
      RELEASE_SELECTION: ${{ needs.plan.outputs.selection }}
      RELEASE_REUSE: ${{ needs.plan.outputs.reuse }}
    steps:
      - name: Report initial disk space
        run: df -h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - uses: ./.github/actions/build-runtime

  publish:
    needs: [plan, independent, build0, build1, build2, build3]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.empty == 'false' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: build-and-release-publication
      queue: max
    permissions:
      contents: write
      actions: read
      attestations: read
    outputs:
      commit: ${{ steps.catalog.outputs.commit }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SELECTION: ${{ needs.plan.outputs.selection }}
      RELEASE_GRAPH: ${{ needs.plan.outputs.graph }}
      RELEASE_REUSE: ${{ needs.plan.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Read the generated package definitions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan
      - name: Use the package definition file
        run: echo "BUILD_REPORTS=$RUNNER_TEMP/release-plan/reports.json" >> "$GITHUB_ENV"
      - name: Register the selected release names
        run: |
          node --input-type=module <<'JS'
          import {registerSelection} from './tools/release-selection.mjs';
          registerSelection({selection: process.env.RELEASE_SELECTION, directory: process.cwd()});
          JS
      - name: Publish this run's verified packages
        id: publish
        continue-on-error: true
        run: node tools/publish-verified.mjs --output "$RUNNER_TEMP/publication"
      - name: Commit registrations and catalogs
        id: catalog
        run: |
          git add --update
          git add -- catalogs attestations
          if ! git diff --cached --quiet; then
            git config user.name procrastinine
            git config user.email 24549552+procrastinine@users.noreply.github.com
            git commit -m 'Publish selected runtime releases'
            gh auth setup-git
            git push origin HEAD:main
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Retain the publication result
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: publication-result
          path: ${{ runner.temp }}/publication/publication-result.json
          if-no-files-found: ignore
      - name: Report incomplete packages
        if: steps.publish.outcome == 'failure'
        run: exit 1

  index:
    needs: publish
    if: ${{ always() && !cancelled() && needs.publish.outputs.commit != '' }}
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      source-revision: ${{ needs.publish.outputs.commit }}
