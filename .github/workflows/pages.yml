name: Package index

on:
  workflow_call:
    inputs:
      source-revision:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-index
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: github-pages-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Bootstrap requires a literal before local actions exist.
        with:
          ref: ${{ inputs.source-revision || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - name: Install locked build-tool dependencies
        run: npm ci --ignore-scripts
      - name: Prepare the sources the index reads
        run: node tools/init-runtime-sources.mjs
      - name: Generate package index
        run: npm run index:build
      - name: Archive package index
        run: tar --dereference --hard-dereference --directory dist/package-index -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github --exclude=".[^/]*" .
      - uses: ./.github/actions/upload-artifact
        with:
          inputs: '{"name":"github-pages-${{ github.run_attempt }}","path":"${{ runner.temp }}/artifact.tar","retention-days":"1","if-no-files-found":"error","overwrite":"true"}'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Bootstrap requires a literal before local actions exist.
        with:
          ref: ${{ inputs.source-revision || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Deploy package index
        id: deployment
        uses: ./.github/actions/deploy-pages
        with:
          inputs: '{"artifact_name":"${{ needs.build.outputs.artifact }}","token":"${{ github.token }}"}'
