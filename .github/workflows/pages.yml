name: Package index

on:
  push:
    branches: [main]
    paths:
      - 'catalogs/**'
      - 'projects.json'
      - 'projects/**'
      - 'runtimes/**'
      - 'sources/maclauncher-android'
      - 'producers/anyps5/source.json'
      - 'producers/nxnative/source.json'
      - 'producers/mpv-render/v7/source.json'
      - 'producers/maclauncher/src/modules/rgss/overlays/mkxpz-filename-nfc/source.json'
      - 'producers/maclauncher/src/modules/shared/onsyuri/runtime/portable-build-v3.json'
      - 'producers/maclauncher/src/modules/alicesoft/decompiler-profiles.json'
      - 'producers/maclauncher/src/modules/java/runtime/steamworks/versions.json'
      - 'producers/maclauncher/src/modules/android/providers/aim/source.json'
      - 'producers/maclauncher/src/modules/ai5/runtime/portable-build-v4.js'
      - 'producers/maclauncher/src/modules/fna/runtime/build.js'
      - 'producers/maclauncher/src/modules/gemrb/runtime/portable-build-v5.js'
      - 'producers/maclauncher/src/modules/gamemaker/overlays/opengmk-macos/apply-emulator.js'
      - 'producers/maclauncher/src/modules/hashlink/runtime/manager.js'
      - 'producers/maclauncher/src/modules/hashlink/runtime/legacy-build.js'
      - 'producers/maclauncher/src/modules/mages/native/current-build.js'
      - 'producers/maclauncher/src/modules/shared/installers/runtime/innoextract-build.js'
      - 'producers/maclauncher/src/modules/kirikiri/native-compat.js'
      - 'producers/maclauncher/src/modules/nitroplus/runtime/build.js'
      - 'producers/maclauncher/src/modules/nscripter/runtime/onscripter-en-manager.js'
      - 'producers/maclauncher/src/modules/minori/runtime/overlay.js'
      - 'producers/maclauncher/src/modules/alicesoft/system3-portable.js'
      - 'producers/maclauncher/src/modules/alicesoft/system35-portable-v3.js'
      - 'producers/maclauncher/src/modules/alicesoft/system4-portable-v3.js'
      - 'producers/maclauncher/src/modules/gamemaker/runtime/catalog.js'
      - 'producers/maclauncher/src/modules/love/runtime/luasteam-source-overlay.js'
      - 'producers/maclauncher/src/modules/shared/reshade/native/processor-sources.json'
      - 'producers/maclauncher/src/modules/shared/reshade/native/retroarch-source.json'
      - 'producers/maclauncher/src/modules/godot/graphics/source.json'
      - 'producers/maclauncher/src/modules/shared/reshade/lens/source.json'
      - 'producers/maclauncher/src/modules/shared/vulkan/native/kosmickrisp-source.json'
      - 'producers/maclauncher/src/modules/crossover/temporal/dxmt/source.json'
      - 'producers/maclauncher/src/modules/crossover/temporal/streamline/source.json'
      - 'producers/maclauncher/src/modules/shared/reshade/libplacebo/scene-profile.json'
      - 'tools/package-index.mjs'
      - 'tools/release-runtime.mjs'
      - 'lib/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Generate package index
        run: npm run index:build
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist/package-index
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy package index
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
