name: Source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Bootstrap requires a literal before local actions exist.
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Install locked build-tool dependencies
        run: npm ci --ignore-scripts
      - name: Initialize source pin metadata
        run: node --input-type=module -e "import {retryNetwork} from './tools/download.mjs'; import {execFileSync} from 'node:child_process'; retryNetwork(()=>execFileSync('git',['submodule','update','--init','--depth','1','--','sources/maclauncher','sources/maclauncher-android','sources/anyps5','sources/steam-bridge-notproton','sources/steam-bridge-wine-headers'],{stdio:['inherit','inherit','pipe']}));"
      - name: Check package and project contracts
        run: npm test
      - name: Check declared release versions
        run: npm run check:versions
