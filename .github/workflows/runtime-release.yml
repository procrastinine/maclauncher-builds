name: Runtime release

on:
  workflow_run:
    workflows: ['Runtime build']
    types: [completed]

permissions:
  contents: write
  actions: read
  attestations: read

concurrency:
  group: runtime-release
  cancel-in-progress: false

jobs:
  publish-verified:
    # A failed matrix can still have successful, signed packages. Catch-up keeps
    # those successes without rerunning them or relying on a local dispatcher.
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    outputs:
      catalog-commit: ${{ steps.catalog.outputs.commit }}
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked publication dependencies
        run: npm ci --ignore-scripts
      - name: Publish verified successful outputs and catch up completed runs
        id: publish
        continue-on-error: true
        run: node tools/publish-verified.mjs --output "$RUNNER_TEMP/verified-publication" --build-run "$BUILD_RUN" --catch-up
      - name: Commit all successful catalog and declaration changes
        id: catalog
        run: |
          git add -- catalogs attestations
          if git diff --cached --quiet; then
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name procrastinine
          git config user.email 24549552+procrastinine@users.noreply.github.com
          git commit -m 'Publish verified runtime catalogs'
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Check the exact catalog commit
        if: steps.catalog.outputs.changed == 'true'
        env:
          CATALOG_COMMIT: ${{ steps.catalog.outputs.commit }}
        run: |
          git clone --no-hardlinks --dissociate "$GITHUB_WORKSPACE" "$RUNNER_TEMP/publication-source-check"
          cd "$RUNNER_TEMP/publication-source-check"
          git checkout --detach "$CATALOG_COMMIT"
          npm ci --ignore-scripts
          git submodule update --init --depth 1 -- sources/maclauncher-android
          npm test
          npm run check:versions
          npm run index:build
      - name: Push the one checked catalog commit
        if: steps.catalog.outputs.changed == 'true'
        run: |
          gh auth setup-git
          git push origin HEAD:main
      - name: Keep the publication evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: verified-publication-plan
          path: |
            ${{ runner.temp }}/verified-publication/publication-plan.json
            ${{ runner.temp }}/verified-publication/publication-result.json
            ${{ runner.temp }}/verified-publication/imported-builds.json
            ${{ runner.temp }}/verified-publication/staged-ledgers
          if-no-files-found: ignore
      - name: Report individual failures after retaining successful publications
        if: steps.publish.outcome == 'failure'
        run: |
          echo 'Some outputs failed verification or publication; successful outputs were retained. See publication-result.json.' >&2
          exit 1
  update-index:
    needs: publish-verified
    if: ${{ always() && !cancelled() && needs.publish-verified.outputs.catalog-commit != '' }}
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      source-revision: ${{ needs.publish-verified.outputs.catalog-commit }}
