name: Runtime release

on:
  workflow_dispatch:
    inputs:
      project:
        description: Registered runtime project ID
        required: false
        type: string
      version:
        description: Exact package version
        required: false
        type: string
      arch:
        description: Package architecture
        required: false
        type: choice
        options: [arm64, x64, universal]
      operation:
        description: Stage, verify, publish one package, or publish every imported signed output
        required: true
        default: verify
        type: choice
        options: [stage, verify, publish, publish-verified]
      dry-run:
        description: Download and verify the publish-verified batch without changing releases or catalogs
        required: false
        default: false
        type: boolean
      build-run:
        description: Runtime build run (required for stage; empty for a package already in its catalog)
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read
  attestations: read

concurrency:
  group: runtime-release
  cancel-in-progress: false

jobs:
  release:
    if: inputs.operation != 'publish-verified'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PROJECT: ${{ inputs.project }}
      VERSION: ${{ inputs.version }}
      ARCH: ${{ inputs.arch }}
      BUILD_RUN: ${{ inputs.build-run }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - name: Require batch mode for dry run
        if: inputs.dry-run
        run: |
          echo "Dry run is available only with publish-verified." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install publication verification dependencies
        run: npm ci --ignore-scripts
      - name: Require main for staging
        if: inputs.operation == 'stage' && github.ref != 'refs/heads/main'
        run: |
          echo "Draft releases are staged only from main." >&2
          exit 1
      - name: Select registered release
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {resolveProject} from './lib/projects.mjs';
          import {releaseTag,validateCatalog} from './lib/project-identity.mjs';
          import {readPublisherInput} from './tools/publisher-files.mjs';
          const p = resolveProject(process.env.PROJECT, undefined, {resolvePins:false});
          if (p.releaseRepository !== process.env.GITHUB_REPOSITORY) throw Error('Release repository differs from its registry.');
          const tag = releaseTag({id: p.id, version: process.env.VERSION, arch: process.env.ARCH});
          const supplied = readPublisherInput({project: p.id});
          if (supplied && process.env.BUILD_RUN) throw Error('Supplied publisher packages do not use a GitHub compilation run.');
          if (supplied && process.env.OPERATION === 'stage') throw Error('Stage supplied publisher archives through release-runtime.mjs stage with their verified local bundle and exact source target.');
          fs.appendFileSync(process.env.GITHUB_ENV, 'PUBLICATION_AUTHORITY=' + (supplied ? 'supplied-publisher' : 'github-build') + '\n');
          if (process.env.OPERATION === 'stage' && !process.env.BUILD_RUN) throw Error('Staging requires a Runtime build run.');
          if (!process.env.BUILD_RUN) {
            const catalog = validateCatalog(JSON.parse(fs.readFileSync('catalogs/' + p.id + '.json')), {project: p.id, repository: p.releaseRepository});
            const record = catalog.packages.find(r => r.version === process.env.VERSION && r.arch === process.env.ARCH);
            if (!record) throw Error('The selected package is absent from its project catalog.');
          } else if (!/^[1-9][0-9]{0,19}$/.test(process.env.BUILD_RUN)) throw Error('Select a Runtime build run ID.');
          fs.appendFileSync(process.env.GITHUB_ENV, 'RELEASE_TAG=' + tag + '\n');
          JS
      - name: Verify the selected build job
        if: inputs.build-run != ''
        run: |
          gh run view "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --json workflowName,headSha,headBranch,status,jobs > "$RUNNER_TEMP/runtime-build-run.json"
          commit=$(node tools/verified-build-run.mjs --input "$RUNNER_TEMP/runtime-build-run.json" --project "$PROJECT" --version "$VERSION" --arch "$ARCH")
          echo "BUILD_SOURCE_REVISION=$commit" >> "$GITHUB_ENV"
      - name: Verify release source commit
        if: inputs.operation != 'stage'
        run: |
          git fetch --no-tags --depth=1 origin "refs/tags/$RELEASE_TAG"
          git cat-file -e 'FETCH_HEAD^{commit}'
          git cat-file -e FETCH_HEAD:projects.json
          echo "RELEASE_SOURCE_REVISION=$(git rev-parse 'FETCH_HEAD^{commit}')" >> "$GITHUB_ENV"
      - name: Select the source commit of the successful build
        if: inputs.operation == 'stage'
        run: |
          commit="$BUILD_SOURCE_REVISION"
          git fetch --no-tags --depth=1 origin "$commit"
          echo "RELEASE_SOURCE_REVISION=$(git rev-parse 'FETCH_HEAD^{commit}')" >> "$GITHUB_ENV"
      - name: Download selected release assets
        if: inputs.build-run == ''
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-assets"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/runtime-assets"
      - name: Verify selected package
        if: inputs.build-run == ''
        run: node tools/release-runtime.mjs verify-assets --assets "$RUNNER_TEMP/runtime-assets" --output "$RUNNER_TEMP/runtime-release" --project "$PROJECT" --version "$VERSION" --arch "$ARCH"
      - name: Download the package built from the tagged commit
        if: inputs.build-run != ''
        run: |
          [ "$BUILD_SOURCE_REVISION" = "$RELEASE_SOURCE_REVISION" ] || { echo "The build run differs from the tagged source commit." >&2; exit 1; }
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name "runtime-$PROJECT-$VERSION-$ARCH" --dir "$RUNNER_TEMP/runtime-release"
      - name: Verify the draft against the built package
        if: inputs.build-run != ''
        run: |
          node tools/release-runtime.mjs verify --bundle "$RUNNER_TEMP/runtime-release" --project "$PROJECT" --version "$VERSION" --arch "$ARCH"
      - name: Verify and record the signed build
        if: env.PUBLICATION_AUTHORITY != 'supplied-publisher'
        run: |
          gh attestation verify "$RUNNER_TEMP/runtime-release/$PROJECT-$VERSION-$ARCH.tar.gz" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/runtime-build.yml" --source-digest "$RELEASE_SOURCE_REVISION" --deny-self-hosted-runners --format json > "$RUNNER_TEMP/verified-build.json"
          node tools/record-github-build.mjs --release-bundle "$RUNNER_TEMP/runtime-release" --bundle "$RUNNER_TEMP/verified-build.json"
      - name: Verify supplied publisher archive
        if: env.PUBLICATION_AUTHORITY == 'supplied-publisher'
        run: node tools/publisher-files.mjs verify --project "$PROJECT" --archive "$RUNNER_TEMP/runtime-release/$PROJECT-$VERSION-$ARCH.tar.gz" --record "$RUNNER_TEMP/runtime-release/$PROJECT-$VERSION-$ARCH.tar.gz.json"
      - name: Stage the existing build artifact
        if: inputs.operation == 'stage'
        run: node tools/release-runtime.mjs stage --bundle "$RUNNER_TEMP/runtime-release" --target "$RELEASE_SOURCE_REVISION"
      - name: Verify the existing draft
        run: node tools/release-runtime.mjs verify-remote --bundle "$RUNNER_TEMP/runtime-release"
      - name: Publish selected draft
        if: inputs.operation == 'publish'
        run: node tools/release-runtime.mjs publish --bundle "$RUNNER_TEMP/runtime-release"
  publish-verified:
    if: inputs.operation == 'publish-verified'
    runs-on: ubuntu-latest
    outputs:
      catalog-commit: ${{ steps.catalog.outputs.commit }}
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry-run }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Verified batches publish only from main." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked publication dependencies
        run: npm ci --ignore-scripts
      - name: Publish imported signed outputs
        run: |
          args=(--output "$RUNNER_TEMP/verified-publication")
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node tools/publish-verified.mjs "${args[@]}"
      - name: Commit catalog changes
        id: catalog
        if: inputs.dry-run == false
        run: |
          git add -- catalogs
          if git diff --cached --quiet; then
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name procrastinine
          git config user.email 24549552+procrastinine@users.noreply.github.com
          git commit -m 'Publish verified runtime catalogs'
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Check the exact catalog commit
        if: steps.catalog.outputs.changed == 'true'
        env:
          CATALOG_COMMIT: ${{ steps.catalog.outputs.commit }}
        run: |
          git clone --no-hardlinks "$GITHUB_WORKSPACE" "$RUNNER_TEMP/publication-source-check"
          cd "$RUNNER_TEMP/publication-source-check"
          git checkout --detach "$CATALOG_COMMIT"
          npm ci --ignore-scripts
          git submodule update --init --depth 1 -- sources/maclauncher-android
          npm test
          npm run check:versions
          npm run index:build
      - name: Push checked catalogs
        if: steps.catalog.outputs.changed == 'true'
        run: |
          gh auth setup-git
          git push origin HEAD:main
      - name: Keep the publication plan
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: verified-publication-plan
          path: |
            ${{ runner.temp }}/verified-publication/publication-plan.json
            ${{ runner.temp }}/verified-publication/publication-result.json
          if-no-files-found: ignore
  update-index:
    needs: publish-verified
    if: needs.publish-verified.outputs.catalog-commit != ''
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      source-revision: ${{ needs.publish-verified.outputs.catalog-commit }}
